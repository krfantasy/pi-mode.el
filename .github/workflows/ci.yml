name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        emacs_version: [28.1, 29.4, 30.1]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jcs090218/setup-emacs@v2
        with:
          version: ${{ matrix.emacs_version }}
      - uses: purcell/setup-elpa@v1
        with:
          melpa: transient package-lint
      - name: Test
        run: make test
      - name: Lint
        run: make lint
